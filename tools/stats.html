<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" />
    <title>Statistiques · Shape Invaders</title>
    <style>
      /*
        The game's look (src/style.css): deep navy, neon cyan / magenta, glowing panels.
        Neon glow stays on the chrome (logo, titles, borders); data marks use steadier steps of the
        game's colors (Normal = cyan, Expert = orange, as in the game) so charts stay easy to read.
      */
      :root {
        color-scheme: dark;
        --bg: #03040c;
        --panel: rgba(10, 14, 36, 0.86);
        --line: rgba(120, 200, 255, 0.25);
        --line-soft: rgba(120, 200, 255, 0.1);
        --text: #e8f1ff;
        --text-2: #b8c0d8;
        --muted: #8a90a8;
        --accent: #3df5ff;
        --pink: #ff4fd8;
        --gold: #ffe14a;
        --series-1: #1aa3ba;
        --series-2: #d96c2c;
        --hover: rgba(61, 245, 255, 0.06);
        --font: ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font: 14px/1.45 var(--font);
        background:
          radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, 0.55), transparent),
          radial-gradient(1px 1px at 78% 9%, rgba(255, 255, 255, 0.45), transparent),
          radial-gradient(1.5px 1.5px at 42% 62%, rgba(255, 255, 255, 0.35), transparent),
          radial-gradient(1px 1px at 88% 48%, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1px 1px at 24% 84%, rgba(255, 255, 255, 0.35), transparent),
          radial-gradient(1.5px 1.5px at 64% 30%, rgba(255, 255, 255, 0.3), transparent),
          radial-gradient(900px 500px at 15% -10%, rgba(61, 245, 255, 0.08), transparent 70%),
          radial-gradient(800px 500px at 100% 0%, rgba(255, 79, 216, 0.07), transparent 70%),
          var(--bg);
        background-size: 420px 420px, 380px 380px, 520px 520px, 460px 460px, 360px 360px, 500px 500px, auto, auto, auto;
        background-attachment: fixed;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 16px 64px;
      }

      /* ---------------------------------------------------------------- header */
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 10px 20px;
        margin-bottom: 20px;
      }
      .logo {
        margin: 0;
        font-size: clamp(26px, 6vw, 38px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 5px #fff, 0 0 14px var(--accent), 0 0 30px var(--accent);
      }
      .logo span {
        color: var(--pink);
        text-shadow: 0 0 5px #fff, 0 0 14px var(--pink), 0 0 30px var(--pink);
      }
      .kicker {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }
      .sub,
      .note {
        color: var(--muted);
        font-size: 13px;
      }
      .note {
        margin: 2px 0 12px;
      }
      code {
        font: 12px ui-monospace, 'Cascadia Mono', Consolas, monospace;
        color: var(--text-2);
      }

      /* ---------------------------------------------------------------- controls */
      .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 16px;
        margin-bottom: 20px;
      }
      .seg {
        display: inline-flex;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
      }
      .seg button,
      .btn {
        border: 1px solid transparent;
        border-radius: 7px;
        background: none;
        color: var(--muted);
        font: 700 12px var(--font);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 7px 12px;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
      }
      .seg button:hover {
        color: var(--text);
      }
      .seg button[aria-pressed='true'] {
        color: var(--text);
        border-color: var(--accent);
        background: rgba(61, 245, 255, 0.12);
        box-shadow: 0 0 12px rgba(61, 245, 255, 0.25);
      }
      .btn {
        border-color: var(--line);
        border-radius: 10px;
        padding: 9px 14px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
      }
      .btn:hover {
        border-color: var(--accent);
        box-shadow: 0 0 14px rgba(61, 245, 255, 0.3);
      }
      .link {
        border: 0;
        background: none;
        color: var(--accent);
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
        padding: 0;
      }

      /* ---------------------------------------------------------------- panels */
      .card,
      .tile {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 0 30px rgba(61, 245, 255, 0.07), inset 0 0 24px rgba(61, 245, 255, 0.03);
        backdrop-filter: blur(6px);
      }
      .card {
        padding: 18px;
        margin-bottom: 16px;
        min-width: 0;
      }
      h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h2 .shape-icon {
        flex: none;
        filter: drop-shadow(0 0 4px currentColor);
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .tile {
        padding: 14px 16px;
      }
      .tile .k {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .tile .v {
        font-size: 26px;
        font-weight: 900;
        margin-top: 4px;
        white-space: nowrap;
        color: #fff;
        text-shadow: 0 0 14px rgba(61, 245, 255, 0.35);
        font-variant-numeric: tabular-nums;
      }
      .tile .d {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
        margin-bottom: 16px;
      }
      .grid2 > .card {
        margin-bottom: 0;
      }
      .row-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 8px;
      }

      /* ---------------------------------------------------------------- charts */
      .chart svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .chart text {
        fill: var(--muted);
        font: 11px var(--font);
        font-variant-numeric: tabular-nums;
      }
      .chart .val {
        fill: var(--text-2);
        font-size: 12px;
      }
      .grid-line {
        stroke: var(--line-soft);
        stroke-width: 1;
      }
      .base-line {
        stroke: var(--line);
        stroke-width: 1;
      }
      .hit {
        fill: transparent;
      }
      .hit:hover {
        fill: var(--hover);
      }
      .s1 {
        fill: var(--series-1);
      }
      .s2 {
        fill: var(--series-2);
      }
      .legend {
        display: flex;
        gap: 14px;
        color: var(--text-2);
        font-size: 13px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
      }

      /* ---------------------------------------------------------------- tables */
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        padding: 8px 10px;
        text-align: right;
        border-bottom: 1px solid var(--line-soft);
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-bottom-color: var(--line);
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      tbody tr:hover {
        background: var(--hover);
      }
      tr.excluded td {
        color: var(--muted);
        text-decoration: line-through;
      }
      tr.excluded td:last-child {
        text-decoration: none;
      }
      .rank-1 td:first-child {
        color: var(--gold);
        font-weight: 900;
        text-shadow: 0 0 8px rgba(255, 225, 74, 0.6);
      }
      input[type='checkbox'] {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
        cursor: pointer;
      }
      .bar-cell {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }
      .mini {
        width: 80px;
        height: 8px;
        border-radius: 4px;
        background: var(--line-soft);
        overflow: hidden;
      }
      .mini span {
        display: block;
        height: 100%;
        border-radius: 0 4px 4px 0;
      }
      .mini .s1 {
        background: var(--series-1);
      }
      .mini .s2 {
        background: var(--series-2);
      }
      details summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
        margin-top: 10px;
      }
      details summary:hover {
        color: var(--accent);
      }
      .empty {
        color: var(--muted);
        padding: 24px 0;
      }
      #tip {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        background: rgba(10, 14, 36, 0.95);
        color: var(--text);
        border: 1px solid var(--accent);
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 13px;
        box-shadow: 0 0 16px rgba(61, 245, 255, 0.25);
        white-space: nowrap;
        display: none;
      }
      #tip b {
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main id="app"><p class="empty">Chargement…</p></main>
    <div id="tip"></div>
    <script type="module" src="./stats.ts"></script>
  </body>
</html>
